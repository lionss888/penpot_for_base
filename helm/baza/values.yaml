# База — Helm values

replicaCount:
  frontend: 1
  backend: 1
  exporter: 1
  api: 1

image:
  frontend:
    repository: penpotapp/frontend
    tag: latest
    pullPolicy: IfNotPresent
  backend:
    repository: penpotapp/backend
    tag: latest
    pullPolicy: IfNotPresent
  exporter:
    repository: penpotapp/exporter
    tag: latest
    pullPolicy: IfNotPresent
  api:
    repository: baza-api
    tag: latest
    pullPolicy: IfNotPresent

baza:
  publicUri: "https://baza.example.com"
  secretKey: ""  # задать при установке

postgresql:
  enabled: true
  auth:
    username: penpot
    password: ""
    database: penpot

valkey:
  enabled: true
  maxmemory: "128mb"

ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
  hosts:
    - host: baza.example.com
      paths:
        - path: /
          pathType: Prefix
          service: baza-frontend
          port: 8080
        - path: /api/baza
          pathType: Prefix
          service: baza-api
          port: 3000
  tls:
    - secretName: baza-tls
      hosts:
        - baza.example.com

resources:
  frontend:
    limits:
      cpu: 500m
      memory: 512Mi
  backend:
    limits:
      cpu: 1000m
      memory: 2Gi
  exporter:
    limits:
      cpu: 500m
      memory: 1Gi
