apiVersion: apps/v1
kind: Deployment
metadata:
  name: baza-backend
  labels:
    app: baza-backend
spec:
  replicas: {{ .Values.replicaCount.backend }}
  selector:
    matchLabels:
      app: baza-backend
  template:
    metadata:
      labels:
        app: baza-backend
    spec:
      containers:
        - name: backend
          image: "{{ .Values.image.backend.repository }}:{{ .Values.image.backend.tag }}"
          imagePullPolicy: {{ .Values.image.backend.pullPolicy }}
          env:
            - name: PENPOT_PUBLIC_URI
              value: {{ .Values.baza.publicUri | quote }}
            - name: PENPOT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: baza-secrets
                  key: secret-key
            - name: PENPOT_DATABASE_URI
              value: "postgresql://{{ .Values.postgresql.auth.username }}:{{ .Values.postgresql.auth.password | default "penpot" }}@baza-db:5432/{{ .Values.postgresql.auth.database }}"
            - name: PENPOT_REDIS_URI
              value: "redis://baza-cache:6379/0"
            - name: PENPOT_OBJECTS_STORAGE_BACKEND
              value: "fs"
            - name: PENPOT_OBJECTS_STORAGE_FS_DIRECTORY
              value: "/opt/data/assets"
          resources:
            {{- toYaml .Values.resources.backend | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: baza-backend
spec:
  selector:
    app: baza-backend
  ports:
    - port: 6060
      targetPort: 6060
  type: ClusterIP
